[project]
name = "raggy-editor"
version = "0.2.0"
description = "A plain-text editor whose Find works by meaning: hybrid retrieval, cited answers, and an offline fallback."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

# ---------------------------------------------------------------------------
# THE ENGINE NEEDS ONE THING.
#
# Everything in `src/raggy/` except `app.py` runs on numpy alone: BM25, the
# TF-IDF+SVD dense retriever, RRF fusion, the reranker, the metrics, the
# incremental cache. That keeps `./run.sh demo`, `eval`, `bench` and the test
# suite dependency-light and offline.
# ---------------------------------------------------------------------------
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# The DESKTOP APP: the Qt editor plus the ONNX encoder runtime.
#   ./run.sh install
app = [
  "PyQt6>=6.6",
  "PyQt6-QScintilla>=2.14",
  # ⚠️ Pinned below 1.20 on purpose: 1.20+ wheels are built for macOS 13.4+ and
  # fail to load on macOS 13.0 with "Symbol not found: to_chars".
  "onnxruntime>=1.19.2,<1.20",
  "tokenizers>=0.19",   # reads tokenizer.json without pulling in transformers
  "certifi",            # CA bundle: python.org builds on macOS have no roots
]

# The real encoder WITHOUT the GUI (CLI + web UI).
neural = [
  "onnxruntime>=1.19.2,<1.20",
  "tokenizers>=0.19",
  "certifi",
]

# The GUI only, for someone who already has the engine installed.
gui = [
  "PyQt6>=6.6",
  "PyQt6-QScintilla>=2.14",
]

# DEVELOPMENT ONLY: the torch-backed encoder, used to verify that the ONNX
# embeddings are identical. Never ship this — it is ~10x the size of ONNX.
neural-torch = [
  "sentence-transformers>=3.0",
]

# The stdlib sidecar needs nothing, but this is the production swap.
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
]

[project.scripts]
raggyeditor = "raggy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raggy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
